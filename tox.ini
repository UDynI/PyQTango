[tox]
envlist = pyqt5, pyqt6
skipsdist = false

[testenv]
deps =
    pytest
    pytest-qt
    pyqt6: pyqt6>=6.4
setenv =
    QT_QPA_PLATFORM = offscreen
    pyqt5: PYQTANGO_QT_API = pyqt5
    pyqt5: PYTEST_QT_API = pyqt5
    pyqt6: PYQTANGO_QT_API = pyqt6
    pyqt6: PYTEST_QT_API = pyqt6
commands =
    pyqt5: pytest -o qt_api=pyqt5 {posargs}
    pyqt6: pytest -o qt_api=pyqt6 {posargs}
